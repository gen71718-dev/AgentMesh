[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentmesh"
version = "0.1.0"
description = "Multi-agent orchestration service built on LangGraph, LangChain, FastAPI and Redis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AgentMesh Contributors" }]
keywords = [
    "ai-agents",
    "multi-agent",
    "langgraph",
    "langchain",
    "fastapi",
    "redis",
    "llm",
    "orchestration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langchain-core>=0.3,<2",
    "langchain>=0.3,<2",
    "langgraph>=0.2.60,<2",
    "langgraph-checkpoint>=2.0,<3",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2,<2"]
anthropic = ["langchain-anthropic>=0.2,<2"]
ollama = ["langchain-ollama>=0.2,<2"]
providers = [
    "langchain-openai>=0.2,<2",
    "langchain-anthropic>=0.2,<2",
    "langchain-ollama>=0.2,<2",
]
redis-checkpoint = ["langgraph-checkpoint-redis>=0.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]
all = [
    "langchain-openai>=0.2,<2",
    "langchain-anthropic>=0.2,<2",
    "langchain-ollama>=0.2,<2",
    "langgraph-checkpoint-redis>=0.1",
]

[project.scripts]
agentmesh = "agentmesh.cli:main"

[project.urls]
Homepage = "https://github.com/gen71718-dev/AgentMesh"
Repository = "https://github.com/gen71718-dev/AgentMesh"
Issues = "https://github.com/gen71718-dev/AgentMesh/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmesh"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["agentmesh"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["agentmesh"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["agentmesh"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["build", "dist"]

